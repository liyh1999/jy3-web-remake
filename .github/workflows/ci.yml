name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/save-store.js
          node --check src/audio.js
          node --check src/audio-controls.js
          node --check src/animation-resources.js
          node --check src/animation-player.js
          node --check src/battle.js
          node --check src/battle-effects.js
          node --check src/gcore-scene.js
          node --check src/input.js
          node --check src/inventory.js
          node --check src/map-scene.js
          node --check src/person.js
          node --check src/shop.js
          node --check src/resource-catalog.js
          node --check src/resources.js
          node --check src/renderer.js
          node --check src/upstream.js
          node --check tools/audit-minigames.mjs
          node --check tools/audit-runtime-compat-policy.mjs
          node --check tools/audit-newgame.mjs
          node --check tools/build-offline.mjs
          node --check tools/check-normalized-upstream.mjs
          node --check tools/check-b4-battle-boundary.mjs
          node --check tools/check-c3-browser-battle.mjs
          node --check tools/check-c3-battle-input.mjs
          node --check tools/check-c3-battle-presentation.mjs
          node --check tools/audit-battle.mjs
          node --check tools/audit-animation-resources.mjs
          node --check tools/test-audio-manager.mjs
          node --check tools/test-audio-settings.mjs
          node --check tools/audit-audio.mjs
          node --check tools/audit-character-appearance.mjs
          node --check tools/smoke-battle-1v1.mjs
          node --check tools/smoke-animation-offline.mjs
          node --check tools/scan-resources.mjs
          node --check tools/smoke-inventory.mjs
          node --check tools/smoke-map-runtime.mjs
          node --check tools/smoke-niujia-events.mjs
          node --check tools/smoke-original-opening.mjs
          node --check tools/smoke-original-opening-flow.mjs
          node --check tools/smoke-person-profile.mjs
          node --check tools/smoke-person-growth.mjs
          node --check tools/smoke-player-skill-growth.mjs
          node --check tools/smoke-character-growth.mjs
          node --check tools/smoke-renderer-canvas.mjs
          node --check tools/smoke-save-state.mjs
          node --check tools/test-save-store.mjs
          node --check tools/test-event-finished-signal.mjs
          node --check tools/check-save-system-integration.mjs
          node --check tools/smoke-shop-runtime.mjs
          node --check tools/smoke-team-management.mjs
          node --check tools/smoke-teammate-interactions.mjs
          node --check tools/test-upstream-module-loader.mjs
          node --check tools/test-program-runtime.mjs
          node --check tools/test-ui-runtime.mjs
          node --check tools/smoke-logging-ui.mjs
          node --check tools/check-minigame-browser-pump.mjs
          node --check tools/test-animation-resources.mjs
          node --check tools/test-battle-effects.mjs
          node --check tools/test-animation-player.mjs
          node --check tools/test-renderer-animation.mjs
          node --check tools/test-input.mjs
          node --check tools/test-map-scene.mjs
          node --check tools/test-renderer.mjs
          node --check tools/test-resource-resolver.mjs
          node --check tools/test-shop-model.mjs
          node --check tools/test-story-runtime-loader.mjs
          node --check tools/test-quanzhen-gumu-runtime-loader.mjs
          node --check tools/test-wudang-huashan-runtime-loader.mjs
          node --check tools/test-shaolin-emei-runtime-loader.mjs
          node --check tools/test-gaibang-taohuadao-runtime-loader.mjs
          node --check tools/test-xingxiu-xuedaomen-runtime-loader.mjs
          node --check tools/test-book-lakes-runtime-loader.mjs
          node --check tools/smoke-quanzhen-gumu-basic.mjs
          node --check tools/smoke-wudang-huashan-basic.mjs
          node --check tools/smoke-shaolin-basic.mjs
          node --check tools/smoke-emei-basic.mjs
          node --check tools/smoke-gaibang-basic.mjs
          node --check tools/smoke-taohuadao-basic.mjs
          node --check tools/smoke-xingxiu-basic.mjs
          node --check tools/smoke-xuedaomen-basic.mjs
          node --check tools/smoke-book-story-entry-baseline.mjs
          node --check tools/smoke-book-yuenv.mjs
          node --check tools/smoke-lakes-notice-dispatcher.mjs
          node --check tools/smoke-lakes-bone-claw.mjs
          node --check tools/smoke-book-second-batch.mjs
          node --check tools/smoke-lakes-second-batch.mjs
          node --check tools/smoke-book-continuous.mjs
          node --check tools/smoke-lakes-third-batch.mjs
          node --check tools/smoke-book-fourth-batch.mjs
          node --check tools/smoke-lakes-fourth-batch.mjs
          node --check tools/smoke-book-fifth-batch.mjs
          node --check tools/smoke-lakes-fifth-batch.mjs
          node --check tools/smoke-book-sixth-batch.mjs
          node --check tools/smoke-book-seventh-batch.mjs
          node --check tools/smoke-book-eighth-batch.mjs
          node --check tools/smoke-lakes-high-risk.mjs
          node --check tools/smoke-lakes-high-risk-state.mjs
          node --check tools/smoke-d4-long-flow.mjs
          node --check tools/browser-e2e-core.mjs
          node --check tools/e2e-core-flow.mjs
          node --check tools/smoke-quanzhen-gumu-transition.mjs
          node --check tools/smoke-gumu-limochou.mjs
          node --check tools/test-story-program-runtime.mjs
          node --check tools/test-cross-system-story-resume.mjs
          node --check tools/smoke-base-story-programs.mjs
          node --check tools/smoke-init-story-programs.mjs
          node --check tools/smoke-person-event-dispatcher.mjs
          node --check tools/smoke-map-event-routing.mjs
          node --check tools/vendor-upstream.mjs
          node --check tools/verify-offline-dist.mjs

      - name: Validate resource id resolver
        run: node tools/test-resource-resolver.mjs

      - name: Validate JYAudio group lifecycle
        run: node tools/test-audio-manager.mjs

      - name: Validate JYAudio settings and page lifecycle
        run: node tools/test-audio-settings.mjs

      - name: Validate upstream Lua module loader
        run: node tools/test-upstream-module-loader.mjs

      - name: Validate independent base story runtime loader
        run: node tools/test-story-runtime-loader.mjs

      - name: Validate independent Quanzhen Gumu runtime loader
        run: node tools/test-quanzhen-gumu-runtime-loader.mjs

      - name: Validate independent Wudang Huashan runtime loader
        run: node tools/test-wudang-huashan-runtime-loader.mjs

      - name: Validate independent Shaolin Emei runtime loader
        run: node tools/test-shaolin-emei-runtime-loader.mjs

      - name: Validate independent Gaibang Taohuadao runtime loader
        run: node tools/test-gaibang-taohuadao-runtime-loader.mjs

      - name: Validate independent Xingxiu Xuedaomen runtime loader
        run: node tools/test-xingxiu-xuedaomen-runtime-loader.mjs

      - name: Validate independent book story lakes runtime loader
        run: node tools/test-book-lakes-runtime-loader.mjs

      - name: Validate original animation resource parser
        run: node tools/test-animation-resources.mjs

      - name: Validate framelist player lifecycle
        run: node tools/test-animation-player.mjs

      - name: Validate original battle effect layout
        run: node tools/test-battle-effects.mjs

      - name: Validate renderer frameActionID binding
        run: node tools/test-renderer-animation.mjs

      - name: Validate gcore scene graph
        run: node tools/test-renderer.mjs

      - name: Validate gcore input mapping
        run: node tools/test-input.mjs

      - name: Validate original map hotspot projection
        run: node tools/test-map-scene.mjs

      - name: Validate shop quantity model
        run: node tools/test-shop-model.mjs

      - name: Validate actual Canvas draw path
        run: node tools/smoke-renderer-canvas.mjs

      - name: Install Lua 5.3 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3

      - name: Check Lua syntax
        run: |
          luac5.3 -p lua/program_runtime.lua
          luac5.3 -p lua/story_program_web.lua
          luac5.3 -p lua/minigame_web.lua
          luac5.3 -p tools/fixtures/smoke-logging-ui.lua
          luac5.3 -p lua/gf_web.lua
          luac5.3 -p lua/gcore_web.lua
          luac5.3 -p lua/battle_web.lua
          luac5.3 -p lua/runtime_shims.lua
          luac5.3 -p lua/save_state.lua
          luac5.3 -p lua/inventory_web.lua
          luac5.3 -p lua/person_web.lua
          luac5.3 -p lua/shop_web.lua
          luac5.3 -p lua/jy3_demo.lua

      - name: Validate reusable Lua program runtime
        run: node tools/test-program-runtime.mjs

      - name: Validate background story program scheduler
        run: node tools/test-story-program-runtime.mjs

      - name: Validate cross-system parent story resume
        run: node tools/test-cross-system-story-resume.mjs

      - name: Validate browser mini-game pump bridge
        run: node tools/check-minigame-browser-pump.mjs

      - name: Validate story-to-mini-game resume bridge
        run: node tools/test-minigame-story-bridge.mjs

      - name: Validate original typo call aliases
        run: node tools/test-original-call-aliases.mjs

      - name: Validate original string and log runtime helpers
        run: node tools/test-runtime-string-utils.mjs

      - name: Validate original deepcopy and dynamic data semantics
        run: node tools/test-runtime-data-utils.mjs

      - name: Validate story wait1 and event_info semantics
        run: node tools/test-story-events.mjs

      - name: Validate original Tween renderer semantics
        run: node tools/test-renderer-tween.mjs

      - name: Validate sandboxed original file APIs
        run: node tools/test-legacy-file-runtime.mjs

      - name: Validate gcore UI template runtime
        run: node tools/test-ui-runtime.mjs

      - name: Map bridge with original data
        run: node tools/smoke-map-runtime.mjs

      - name: Inventory adapter behavior
        run: node tools/smoke-inventory.mjs

      - name: Player profile adapter behavior
        run: node tools/smoke-person-profile.mjs

      - name: Original team and martial arts state
        run: node tools/smoke-person-growth.mjs

      - name: Original team join/leave behavior
        run: node tools/smoke-team-management.mjs

      - name: Original player martial growth
        run: node tools/smoke-player-skill-growth.mjs

      - name: Original character growth
        run: node tools/smoke-character-growth.mjs

      - name: Original teammate relationship interactions
        run: node tools/smoke-teammate-interactions.mjs

      - name: B4 battle shared-state boundary
        run: node tools/check-b4-battle-boundary.mjs

      - name: Original shop settlement behavior
        run: node tools/smoke-shop-runtime.mjs

      - name: Save-state roundtrip
        run: node tools/smoke-save-state.mjs

      - name: Versioned multi-slot save store
        run: node tools/test-save-store.mjs

      - name: Story completion autosave signal
        run: node tools/test-event-finished-signal.mjs

      - name: Multi-slot save integration guard
        run: node tools/check-save-system-integration.mjs

      - name: Compile normalized upstream Lua
        run: node tools/check-normalized-upstream.mjs

      - name: Audit original battle API coverage
        run: node tools/audit-battle.mjs

      - name: Original minimal 1v1 battle state machine
        run: node tools/smoke-battle-1v1.mjs

      - name: C3 browser original-battle bridge
        run: node tools/check-c3-browser-battle.mjs

      - name: C3 original battle input bridge
        run: node tools/check-c3-battle-input.mjs

      - name: C3 battle presentation and audio bridge
        run: node tools/check-c3-battle-presentation.mjs

      - name: Audit original opening API coverage
        run: node tools/audit-newgame.mjs

      - name: Run original opening to first UI yield
        run: node tools/smoke-original-opening.mjs

      - name: Drive questionnaire through Niujia Village intro
        run: node tools/smoke-original-opening-flow.mjs

      - name: Execute original Niujia Village events
        run: node tools/smoke-niujia-events.mjs

      - name: Smoke-test source static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/jy3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8080/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/gf_web.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/save-store.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/story_program_web.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/gcore_web.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/battle_web.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/save_state.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/inventory_web.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/person_web.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lua/shop_web.lua >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/audio-controls.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/audio.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/resource-catalog.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/resources.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/renderer.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/input.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/map-scene.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/gcore-scene.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/inventory.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/inventory.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/person.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/person.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/shop.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/shop.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/battle-effects.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/battle.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/animation-resources.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/animation-player.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app.js >/dev/null

      - name: Cache pinned offline inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run cache:offline

      - name: Execute original base world and task branches
        run: node tools/smoke-base-story-programs.mjs

      - name: Execute original p_init background startup
        run: node tools/smoke-init-story-programs.mjs

      - name: Execute original p_person event dispatcher
        run: node tools/smoke-person-event-dispatcher.mjs

      - name: Execute original p_event to p_person routing
        run: node tools/smoke-map-event-routing.mjs

      - name: Execute original Quanzhen Gumu basic sect branches
        run: node tools/smoke-quanzhen-gumu-basic.mjs

      - name: Execute original Quanzhen to Gumu transition
        run: node tools/smoke-quanzhen-gumu-transition.mjs

      - name: Execute original Gumu Li Mochou branch
        run: node tools/smoke-gumu-limochou.mjs

      - name: Execute original Wudang Huashan sect branches
        run: node tools/smoke-wudang-huashan-basic.mjs

      - name: Execute original Shaolin sect branches
        run: node tools/smoke-shaolin-basic.mjs

      - name: Execute original Emei sect branches
        run: node tools/smoke-emei-basic.mjs

      - name: Execute original Gaibang sect branches
        run: node tools/smoke-gaibang-basic.mjs

      - name: Execute original Taohuadao sect branches
        run: node tools/smoke-taohuadao-basic.mjs

      - name: Execute original Xingxiu sect branches
        run: node tools/smoke-xingxiu-basic.mjs

      - name: Execute original Xuedaomen sect branches
        run: node tools/smoke-xuedaomen-basic.mjs

      - name: Execute all original book story entry guards
        run: node tools/smoke-book-story-entry-baseline.mjs

      - name: Execute original Yue Maiden book story
        run: node tools/smoke-book-yuenv.mjs

      - name: Execute original lakes notice dispatcher
        run: node tools/smoke-lakes-notice-dispatcher.mjs

      - name: Execute original lakes Bone Claw task
        run: node tools/smoke-lakes-bone-claw.mjs

      - name: Execute second-batch original book stories
        run: node tools/smoke-book-second-batch.mjs

      - name: Execute second-batch original lakes tasks
        run: node tools/smoke-lakes-second-batch.mjs

      - name: Execute continuous multi-stage original book stories
        run: node tools/smoke-book-continuous.mjs

      - name: Execute third-batch original lakes task
        run: node tools/smoke-lakes-third-batch.mjs

      - name: Execute fourth-batch original book stories
        run: node tools/smoke-book-fourth-batch.mjs

      - name: Execute fourth-batch original lakes tasks
        run: node tools/smoke-lakes-fourth-batch.mjs

      - name: Execute fifth-batch original book stories
        run: node tools/smoke-book-fifth-batch.mjs

      - name: Execute fifth-batch original lakes tasks
        run: node tools/smoke-lakes-fifth-batch.mjs

      - name: Execute sixth-batch original book stories
        run: node tools/smoke-book-sixth-batch.mjs

      - name: Execute seventh-batch original book stories
        run: node tools/smoke-book-seventh-batch.mjs

      - name: Execute eighth-batch original book story
        run: node tools/smoke-book-eighth-batch.mjs

      - name: Execute high-risk lakes branch matrix
        run: node tools/smoke-lakes-high-risk.mjs

      - name: Execute high-risk lakes state paths
        run: node tools/smoke-lakes-high-risk-state.mjs

      - name: Execute D4 cross-module long flow
        run: node tools/smoke-d4-long-flow.mjs

      - name: Audit full original program API coverage
        run: |
          node tools/audit-program-api-coverage.mjs
          sed -n '1,220p' reports/program-api-coverage.md

      - name: Audit runtime compatibility debt policy
        run: |
          node tools/audit-runtime-compat-policy.mjs
          sed -n '1,160p' reports/runtime-compat-policy.md

      - name: Audit original map and NPC mini-game entries
        run: node tools/audit-minigame-entrypoints.mjs

      - name: Smoke original notify registration and dispatch
        run: node tools/smoke-notify-runtime.mjs

      - name: Smoke original dialogue UI and event flow
        run: node tools/smoke-dialogue-ui.mjs

      - name: Smoke original logging, mining, fishing, hunting and gambling UI
        run: node tools/smoke-logging-ui.mjs

      - name: Audit original five mini-game contracts
        run: node tools/audit-minigames.mjs

      - name: Audit pinned original audio protocol
        run: node tools/audit-audio.mjs

      - name: Audit pinned original animation resources
        run: |
          node tools/audit-animation-resources.mjs
          sed -n '1,120p' reports/animation-resource-audit.md

      - name: Audit original character appearance rules
        run: |
          node tools/audit-character-appearance.mjs
          sed -n '1,140p' reports/character-appearance-audit.md

      - name: Smoke real offline animation actions
        run: node tools/smoke-animation-offline.mjs

      - name: Scan resource references and integrity
        run: |
          npm run scan:resources
          sed -n '1,140p' reports/resource-integrity.md

      - name: Build distribution from local cache only
        run: |
          npm run build:offline
          test -f dist/vendor/fengari/fengari-web.js
          test -f dist/vendor/upstream/JY3/script/01_data/o_headevent.lua
          test -f dist/vendor/upstream/JY3/script/01_data/o_battle.lua
          test -f dist/vendor/upstream/JY3/script/01_data/o_notebook.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_init.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_battle.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_citymap_system.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_newgame.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_niujiacun.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_task.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_school_shaolin.lua
          test -f dist/vendor/upstream/JY3/script/04_program/p_school_gaibang.lua
          test -f "dist/vendor/upstream/JY3/script/04_program/p_story-town or city.lua"
          test -f dist/vendor/upstream/JY3/script/06_notify/n_dialogue_system.lua
          test -f dist/vendor/upstream/JY3/script/06_notify/n_cheat_system.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_battle.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_button.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_logging.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_movie.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_empty.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_dig.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_fishing.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_hunting.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_gambling.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_dialogue_system_story.lua
          test -f dist/vendor/upstream/JY3/script/02_ui_view/v_dialogue_system_select.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_button.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_logging.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_movie.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_dig.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_fishing.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_hunting.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_gambling.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_dialogue_system_story.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_dialogue_system_select.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_scrollview.lua
          test -f dist/vendor/upstream/JY3/script/03_ui_component/c_layout_v.lua
