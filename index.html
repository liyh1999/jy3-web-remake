<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金庸群侠传3 Web Runtime</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./src/inventory.css" />
  <link rel="stylesheet" href="./src/person.css" />
  <link rel="stylesheet" href="./src/shop.css" />
</head>
<body>
  <main id="shell">
    <section id="game" aria-label="JY3 web runtime">
      <header class="topbar">
        <div>
          <div class="brand">金庸群侠传 3</div>
          <div class="subtitle">Web Runtime · original Lua compatibility layer</div>
        </div>
        <div class="runtime" id="runtimeStatus">加载 Lua Runtime…</div>
      </header>

      <section id="scene" class="scene title-scene">
        <div class="mountains"></div>
        <div class="ink ink-a"></div>
        <div class="ink ink-b"></div>
        <div class="title-copy">
          <div class="seal">叁</div>
          <h1>金庸群侠传</h1>
          <p>保留 jy3-mirror 原 Lua 剧情/数据，替换缺失的 gcore 桌面运行时。</p>
          <button id="startBtn" class="primary" disabled>开始兼容层验证</button>
          <button id="villageBtn" class="ghost" disabled>直接进入牛家村测试</button>
          <button id="originalBtn" class="ghost" disabled>运行原 p_newgame.lua</button>
        </div>
      </section>

      <section id="hud" class="hud hidden">
        <div class="portrait">侠</div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="money">银两 <strong id="money">0</strong></div>
        <div class="save-actions">
          <button id="personBtn" disabled>人物</button>
          <button id="inventoryBtn" disabled>背包</button>
          <button id="saveBtn" disabled>存档</button>
          <button id="loadBtn" disabled>读档</button>
        </div>
      </section>

      <section id="dialogue" class="dialogue hidden">
        <div class="speaker" id="speaker">旁白</div>
        <div class="dialogue-text" id="dialogueText"></div>
        <div id="options" class="options"></div>
        <button id="continueBtn" class="primary hidden">继续</button>
      </section>

      <section id="personPanel" class="person-panel hidden" aria-label="人物属性">
        <button id="personBackdrop" class="person-backdrop" aria-label="关闭人物属性"></button>
        <div class="person-window">
          <header class="person-header">
            <strong>人物属性</strong>
            <button id="personClose" class="person-close">关闭</button>
          </header>
          <div class="person-content">
            <aside class="person-identity">
              <div id="personPortrait" class="person-portrait">侠</div>
              <div class="person-id-card">
                <h2 id="personName">无名侠客</h2>
                <span id="personNickname">无绰号</span>
                <div class="person-id-row"><span>门派</span><b id="personSchool">无门派</b></div>
                <div class="person-id-row"><span>位阶</span><b id="personRank">—</b></div>
                <div class="person-id-row"><span>师承</span><b id="personMaster">—</b></div>
              </div>
            </aside>
            <div class="person-main">
              <section class="person-section">
                <h3>状态</h3>
                <div id="personVitals" class="person-stats"></div>
              </section>
              <section class="person-section">
                <h3>基础资质</h3>
                <div id="personQualities" class="person-qualities"></div>
              </section>
              <section class="person-section">
                <h3>装备</h3>
                <div id="personSlots" class="person-slots"></div>
              </section>
            </div>
          </div>
        </div>
      </section>

      <section id="inventoryPanel" class="inventory-panel hidden" aria-label="人物背包">
        <button id="inventoryBackdrop" class="inventory-backdrop" aria-label="关闭背包"></button>
        <div class="inventory-window">
          <header class="inventory-header">
            <div>
              <strong>人物背包</strong>
              <span>银两 <b id="inventoryMoney">0</b></span>
            </div>
            <button id="inventoryClose" class="inventory-close">关闭</button>
          </header>
          <div id="inventorySlots" class="inventory-slots"></div>
          <div id="inventoryStatus" class="inventory-status"></div>
          <div id="inventoryList" class="inventory-list"></div>
        </div>
      </section>

      <section id="battle" class="battle hidden">
        <div class="battle-title" id="battleTitle">比武</div>
        <div class="fighters">
          <div class="fighter">
            <span>你</span>
            <div class="hp"><i id="playerHpBar"></i></div>
            <b id="playerHpText">100 / 100</b>
          </div>
          <div class="versus">VS</div>
          <div class="fighter">
            <span id="enemyName">穆念慈</span>
            <div class="hp"><i id="enemyHpBar"></i></div>
            <b id="enemyHpText">100 / 100</b>
          </div>
        </div>
        <div class="battle-log" id="battleLog">战斗开始。</div>
        <button id="attackBtn" class="danger">普通攻击</button>
      </section>

      <!-- Compatibility mount point only. Village/NPC interaction is driven by
           original o_citymap_system_* data projected onto the gcore canvas. -->
      <section id="villageActions" class="village-actions hidden" aria-hidden="true"></section>

      <footer class="footer">
        <span>逻辑：Lua 5.3 / Fengari</span>
        <span>运行时：HTML5 / JS</span>
        <span>原设计：853 × 480</span>
      </footer>
    </section>
  </main>

  <script src="./vendor/fengari/fengari-web.min.js"></script>
  <script>
    if (!window.fengari) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.min.js"><\\/script>');
    }
  </script>
  <script src="./src/resource-catalog.js"></script>
  <script src="./src/resources.js"></script>
  <script src="./src/renderer.js"></script>
  <script src="./src/input.js"></script>
  <script src="./src/map-scene.js"></script>
  <script src="./src/upstream.js"></script>
  <script src="./src/shop.js"></script>
  <script src="./src/app.js"></script>
  <script src="./src/gcore-scene.js"></script>
  <script src="./src/inventory.js"></script>
  <script src="./src/person.js"></script>
</body>
</html>
